{% extends 'base.html' %}
{% block content %}
    <h1>Оголошення</h1>
    {% for announce in announcements %}
    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
          <div class="col-md-4">
            {% if  announce.attachment%}
            <img src="{{announce.attachment.url}}" class="img-fluid rounded-start" alt="...">
            {% endif %}
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">{{announce.title}}</h5>
              <p class="card-text">{{announce.content}}</p>
              <p class="card-text"><small class="text-body-secondary">{{announce.created_at}}</small></p>
            </div>
          </div>
        </div>
      </div>
        
    {% endfor %}
{% endblock content %}
