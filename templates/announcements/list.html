{% extends 'base.html' %}

{% block content %}
<h1>Оголошення</h1>

{% for announce in announcements %}
    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
            <div class="col-md-4">
                {% if announce.attachment %}
                    <img src="{{ announce.attachment.url }}" class="img-fluid rounded-start" alt="Зображення">
                {% endif %}
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">{{ announce.title }}</h5>
                    <p class="card-text">{{ announce.content }}</p>
                    <p class="card-text">
                        <small class="text-muted">{{ announce.created_at|date:"d.m.Y H:i" }}</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% empty %}
    <p>Немає оголошень.</p>
{% endfor %}

{% endblock content %}
