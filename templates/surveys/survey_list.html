{% extends "base.html" %}
{% block title %}Опитування{% endblock %}
{% block content %}
<h2>Список опитувань</h2>
<ul class="list-group">
  {% for survey in surveys %}
    <li class="list-group-item">
      <a href="{% url 'surveys:survey_detail' survey.pk %}">{{ survey.title }}</a>
    </li>
  {% empty %}
    <li class="list-group-item">Немає активних опитувань</li>
  {% endfor %}
</ul>
{% endblock %}
