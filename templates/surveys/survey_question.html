{% extends "base.html" %}
{% block title %}{{ survey.title }}{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h5>{{ question.text }}</h5>

    <div class="progress my-3" style="height: 8px;">
      <div class="progress-bar bg-success" style="width: {{ progress }}%;"></div>
    </div>
    <small class="text-muted">Питання {{ current }} з {{ total }}</small>

    <form method="POST" class="mt-3">
      {% csrf_token %}
      {% for choice in question.choices.all %}
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="choice" id="choice{{ choice.id }}" value="{{ choice.id }}" required>
          <label class="form-check-label" for="choice{{ choice.id }}">{{ choice.text }}</label>
        </div>
      {% endfor %}
      <div class="text-end mt-3">
        <button type="submit" class="btn btn-primary">Далі</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
